name: Real Capture Smoke

on:
  workflow_dispatch:

jobs:
  linux-kde-wayland:
    name: Linux KDE Wayland smoke
    runs-on: [self-hosted, linux, kde6, wayland]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux capture deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libpipewire-0.3-dev libclang-dev libdbus-1-dev

      - name: Run Linux portal smoke test
        env:
          ROLLSHOT_REAL_CAPTURE: "1"
        run: cargo test -p rollshot-capture --test linux_portal_smoke -- --ignored --nocapture

  macos-screencapturekit:
    name: macOS ScreenCaptureKit smoke
    runs-on: [self-hosted, macos, screencapturekit]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run macOS ScreenCaptureKit smoke test
        env:
          ROLLSHOT_REAL_CAPTURE: "1"
        run: cargo test -p rollshot-capture --test macos_sck_smoke -- --ignored --nocapture
