name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux capture deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libpipewire-0.3-dev libclang-dev libdbus-1-dev libxkbcommon-dev

      - name: Check explicit tracing targets
        run: ./scripts/check-tracing-targets.sh

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --exclude rollshot-ocr --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --exclude rollshot-ocr

      - name: Clippy (action-guide feature)
        run: cargo clippy --workspace --exclude rollshot-ocr --all-targets --features rollshot-app/action-guide -- -D warnings

      - name: Test (action-guide feature)
        run: cargo test --workspace --exclude rollshot-ocr --features rollshot-app/action-guide

      - name: Check macOS targets
        if: runner.os == 'macOS'
        run: |
          cargo check -p rollshot-capture --all-targets
          cargo check -p rollshot-dev --all-targets
          cargo check -p rollshot-iced-overlay --all-targets
          cargo check -p rollshot-app --all-targets
          cargo check -p rollshot-macos-oneshot --all-targets
          cargo check -p rollshot-macos-input --all-targets
          cargo check -p rollshot-linux-input --all-targets
