name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend-test:
    name: Frontend Test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
          cache-dependency-path: crates/rollshot-tauri-app/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir crates/rollshot-tauri-app install --frozen-lockfile

      - name: Test frontend
        run: pnpm --dir crates/rollshot-tauri-app test

      - name: Typecheck frontend
        run: pnpm --dir crates/rollshot-tauri-app typecheck

      - name: Build frontend
        run: pnpm --dir crates/rollshot-tauri-app build

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux capture deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libpipewire-0.3-dev libclang-dev libdbus-1-dev
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Check macOS ScreenCaptureKit feature
        if: runner.os == 'macOS'
        run: |
          cargo check -p rollshot-capture --all-targets --no-default-features --features macos-sck
          cargo check -p rollshot-cli --all-targets --no-default-features --features macos-sck
          cargo check -p rollshot-tauri-app --all-targets --no-default-features --features macos-sck
          cargo check -p rollshot-iced-overlay --all-targets --no-default-features --features macos-sck
          cargo check -p rollshot-app --all-targets --no-default-features --features macos-sck
