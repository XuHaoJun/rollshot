name: Spike CI

on:
  workflow_dispatch:

jobs:
  spikes:
    name: Spikes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux deps (iced needs xkbcommon/wayland; no libclang needed)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev
      - name: Build all targets + run tests for every spike crate
        shell: bash
        run: |
          set -euxo pipefail
          shopt -s nullglob
          found=0
          for d in spikes/*/; do
            if [ -f "$d/Cargo.toml" ]; then
              found=1
              echo "::group::$d"
              # build benches/tests/bins, but do NOT execute harness=false benches under `cargo test`
              (cd "$d" && cargo build --all-targets && cargo test)
              echo "::endgroup::"
            fi
          done
          if [ "$found" = 0 ]; then echo "no spike crates yet"; fi

  floor-check:
    name: Floor check (Rust 1.88, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev
      - name: Build every spike crate on the workspace floor (1.88)
        shell: bash
        run: |
          set -uxo pipefail
          shopt -s nullglob
          for d in spikes/*/; do
            if [ -f "$d/Cargo.toml" ]; then
              echo "::group::$d (1.88)"
              # step-level: a build FAILURE here is EVIDENCE (candidate needs > 1.88),
              # not a pipeline failure. Read the log, not the dot.
              (cd "$d" && cargo +1.88.0 build) || echo "FLOOR-CHECK-FAILED: $d (this is evidence, read log above)"
              echo "::endgroup::"
            fi
          done
