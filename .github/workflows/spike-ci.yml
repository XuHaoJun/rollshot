name: Spike CI

on:
  # pull_request runs on the open PR (#60) when spike files change, so macOS
  # results are available on the feature branch (workflow_dispatch only works
  # once the workflow is on the default branch). Push to the branch -> CI runs.
  pull_request:
    paths:
      - 'spikes/**'
      - '.github/workflows/spike-ci.yml'
  workflow_dispatch:

jobs:
  spikes:
    name: Spikes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux deps (iced needs xkbcommon/wayland; no libclang needed)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev
      - name: Build all targets + run tests for this plan's spike crates
        shell: bash
        run: |
          # Only THIS plan's spikes — NOT spikes/layershell-feasibility (an unrelated
          # pre-existing spike needing Wayland/glib system libs, impossible on macOS).
          # No `set -e`: attempt every crate, then fail at the end if any failed, so one
          # crate cannot hide the others.
          set -uxo pipefail
          fail=0
          for name in sandbox-executor js-frontend rig-agent visual-diff; do
            d="spikes/$name"
            [ -d "$d" ] || { echo "skip $d (not present yet)"; continue; }
            echo "::group::$d"
            # build benches/tests/bins, but do NOT execute harness=false benches under `cargo test`
            if (cd "$d" && cargo build --all-targets && cargo test); then
              echo "$d: OK"
            else
              echo "$d: FAILED"; fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

  floor-check:
    name: Floor check (Rust 1.89, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev
      - name: Build this plan's spike crates on the workspace floor (1.89)
        shell: bash
        run: |
          # 1.89 = verified true workspace floor (wide@1.4.0 needs 1.89). Only this
          # plan's spikes; layershell-feasibility excluded.
          set -uxo pipefail
          for name in sandbox-executor js-frontend rig-agent visual-diff; do
            d="spikes/$name"
            [ -d "$d" ] || { echo "skip $d (not present yet)"; continue; }
            echo "::group::$d (1.89)"
            # step-level: a build FAILURE here is EVIDENCE (candidate needs > floor),
            # not a pipeline failure. Read the log, not the dot.
            (cd "$d" && cargo +1.89.0 build) || echo "FLOOR-CHECK-FAILED: $d (this is evidence, read log above)"
            echo "::endgroup::"
          done
