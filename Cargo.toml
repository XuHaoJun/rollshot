[workspace]
members = [
    "crates/rollshot-core",
    "crates/rollshot-image-document",
    "crates/rollshot-action",
    "crates/rollshot-linux-input",
    "crates/rollshot-macos-input",
    "crates/rollshot-capture",
    "crates/rollshot-dev",
    "crates/rollshot-app",
    "crates/rollshot-iced-overlay",
    "crates/rollshot-overlay-core",
    "crates/rollshot-macos-oneshot",
    "crates/rollshot-linux-desktop",
    "crates/rollshot-edit-proposal",
    "crates/rollshot-automation",
    "crates/rollshot-automation-rquickjs",
    "crates/rollshot-vision",
    "crates/rollshot-agent",
    "crates/rollshot-preset",
    "crates/rollshot-ocr",
]
# rollshot-ocr is excluded from default-members (eng-review D17): the heavy
# ort + 15.5 MB-model toolchain is built only via `-p rollshot-ocr` / the
# `ocr` feature / the dedicated OCR CI lane, not bare `cargo build`/`test`.
default-members = [
    "crates/rollshot-core",
    "crates/rollshot-image-document",
    "crates/rollshot-action",
    "crates/rollshot-linux-input",
    "crates/rollshot-macos-input",
    "crates/rollshot-capture",
    "crates/rollshot-dev",
    "crates/rollshot-app",
    "crates/rollshot-iced-overlay",
    "crates/rollshot-overlay-core",
    "crates/rollshot-macos-oneshot",
    "crates/rollshot-linux-desktop",
    "crates/rollshot-edit-proposal",
    "crates/rollshot-automation",
    "crates/rollshot-automation-rquickjs",
    "crates/rollshot-vision",
    "crates/rollshot-agent",
    "crates/rollshot-preset",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/xuhaojun/rollshot"
rust-version = "1.94"

[workspace.dependencies]
anyhow = "1"
etcetera = "0.11"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
imageproc = { version = "0.26", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
scap = { package = "zed-scap", version = "0.0.8-zed", default-features = false }
ashpd = { version = "0.9", default-features = false, features = ["tokio"] }
futures-util = "0.3"
pipewire = "0.10"
tokio = { version = "1", features = ["rt", "sync", "time"] }
nix = { version = "0.29", features = ["fs", "poll", "signal"] }
rayon = "1.10"
url = "2"
zbus = "4.4"
wayland-backend = "0.3.15"
wayland-client = "0.31.14"
wayland-scanner = "0.31.10"
wide = "1.4.0"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
fs4 = "1.1"
oxc_allocator = "=0.137.0"
oxc_ast = "=0.137.0"
oxc_parser = "=0.137.0"
oxc_span = "=0.137.0"
rquickjs = "=0.12.0"
tokio-util = "0.7"
schemars = "1"
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"

# Shrink target/ debug artifacts: keep line numbers for our backtraces,
# drop full debug info from third-party deps (the bulk of the size).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
