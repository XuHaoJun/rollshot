[workspace]
members = [
    "crates/rollshot-core",
    "crates/rollshot-image-document",
    "crates/rollshot-action",
    "crates/rollshot-linux-input",
    "crates/rollshot-macos-input",
    "crates/rollshot-capture",
    "crates/rollshot-cli",
    "crates/rollshot-app",
    "crates/rollshot-iced-overlay",
    "crates/rollshot-overlay-core",
    "crates/rollshot-macos-oneshot",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/xuhaojun/rollshot"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
scap = { package = "zed-scap", version = "0.0.8-zed", default-features = false }
ashpd = { version = "0.9", default-features = false, features = ["tokio"] }
pipewire = "0.10"
tokio = { version = "1", features = ["rt", "sync", "time"] }
nix = { version = "0.29", features = ["fs", "poll"] }
rayon = "1.10"
url = "2"
zbus = "4.4"
wayland-backend = "0.3.15"
wayland-client = "0.31.14"
wayland-scanner = "0.31.10"
wide = "1.4.0"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"
