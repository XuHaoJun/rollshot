[package]
name = "spike-visual-diff"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
iced = { version = "0.14", features = ["canvas", "image", "tokio"] }
image = { version = "0.25", default-features = false, features = ["png"] }
similar = "2"
tracing = "0.1"

[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "overlay_cull"
harness = false
