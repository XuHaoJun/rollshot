<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 -4.5 268 268" fill="none" aria-label="Rollshot tray icon">
  <title>Rollshot tray icon</title>
  <desc>Smooth vector redraw of the Rollshot tray icon (screen frame with camera and rolling bottom edge).</desc>
  <g stroke="currentColor" stroke-width="12.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Frame: left border, top, right border curling into the roll, bottom bar, top edge ending in the paper tip -->
    <path d="M 50.75 152.5
             L 50.75 58.5
             A 16 16 0 0 1 66.75 42.5
             L 215 42.5
             A 16 16 0 0 1 231 58.5
             L 231 202
             A 21 21 0 0 1 210 223
             L 58.5 223
             A 13.25 13.25 0 0 1 45.25 209.75
             L 45.25 189.5
             A 13.25 13.25 0 0 1 58.5 176.25
             L 203.5 176.25" />
    <!-- Inner curl of the roll: top edge dives down and sweeps into the bottom edge -->
    <path d="M 189.75 177
             L 189.75 202
             A 21 21 0 0 0 210.75 223" />
    <!-- Camera outline -->
    <path d="M 87 152.5
             L 87 100.25
             L 111.5 100.25
             L 124.75 87
             L 151.25 87
             L 164.5 100.25
             L 189 100.25
             L 189 152.5" />
  </g>
  <!-- Flash dot -->
  <circle cx="189" cy="81" r="6.25" fill="currentColor"/>
</svg>
