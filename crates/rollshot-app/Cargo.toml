[package]
name = "rollshot-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "rollshot-app"
path = "src/main.rs"

[features]
action-guide = ["dep:rollshot-action", "dep:rollshot-linux-input", "dep:rollshot-macos-input"]

[dependencies]
arboard = "3.4"
chrono = "0.4"
dirs = "6"
iced = { version = "0.14", features = ["canvas", "image", "tokio"] }
image = { workspace = true }
rfd = "0.15"
rollshot-action = { path = "../rollshot-action", optional = true }
rollshot-capture = { path = "../rollshot-capture" }
rollshot-iced-overlay = { path = "../rollshot-iced-overlay" }
rollshot-image-document = { path = "../rollshot-image-document" }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
raw-window-handle = "0.6"
rollshot-macos-input = { path = "../rollshot-macos-input", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
rollshot-linux-input = { path = "../rollshot-linux-input", optional = true }
url = { workspace = true }
zbus = { workspace = true }

[dev-dependencies]
tempfile = "3"

# Narrowed from the workspace `forbid(unsafe_code)`: the AppKit native-drag
# bridge in `macos_native_drag.rs` is an audited unsafe boundary (mirrors
# rollshot-iced-overlay), so this package uses `deny` with explicit
# `#[allow(unsafe_code)]` on the bridge functions instead of a global forbid.
[lints.rust]
unsafe_code = "deny"
