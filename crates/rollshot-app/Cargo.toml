[package]
name = "rollshot-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "rollshot-app"
path = "src/main.rs"

[features]
action-guide = ["dep:rollshot-action", "dep:rollshot-linux-input", "dep:rollshot-macos-input", "rollshot-iced-overlay/action-guide"]
ocr = ["rollshot-vision/ocr"]

[dependencies]
arboard = "3.4"
async-stream = "0.3"
chrono = "0.4"
dirs = "6"
etcetera = { workspace = true }
ffmpeg-sidecar = { workspace = true }
fs4 = { workspace = true }
iced = { version = "0.14", features = ["advanced", "canvas", "image", "tokio"] }
image = { workspace = true }
rfd = "0.15"
sha2 = "0.10"
rollshot-action = { path = "../rollshot-action", optional = true }
rollshot-agent = { path = "../rollshot-agent" }
rollshot-automation = { path = "../rollshot-automation" }
rollshot-automation-rquickjs = { path = "../rollshot-automation-rquickjs" }
rollshot-capture = { path = "../rollshot-capture" }
rollshot-edit-proposal = { path = "../rollshot-edit-proposal" }
rollshot-iced-overlay = { path = "../rollshot-iced-overlay" }
rollshot-image-document = { path = "../rollshot-image-document" }
rollshot-preset = { path = "../rollshot-preset" }
rollshot-vision = { path = "../rollshot-vision" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
clap = { workspace = true }
zip = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
global-hotkey = "0.8"
nix = { workspace = true }
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
raw-window-handle = "0.6"
rollshot-macos-input = { path = "../rollshot-macos-input", optional = true }
tray-icon = "0.24"
winit = "0.30"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { workspace = true }
futures-util = { workspace = true }
ksni = { version = "0.3", features = ["blocking"] }
nix = { workspace = true }
rollshot-linux-desktop = { path = "../rollshot-linux-desktop" }
rollshot-linux-input = { path = "../rollshot-linux-input", optional = true }
url = { workspace = true }
zbus = { workspace = true }

[dev-dependencies]
ab_glyph = "0.2"
base64 = "0.22"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "server-graceful"] }
imageproc = { workspace = true, features = ["text"] }
reqwest = { version = "0.13", features = ["stream"] }
serde_json = { workspace = true }
tempfile = "3"
wiremock = "0.6"

# Narrowed from the workspace `forbid(unsafe_code)`: the AppKit native-drag
# bridge in `macos_native_drag.rs` is an audited unsafe boundary (mirrors
# rollshot-iced-overlay), so this package uses `deny` with explicit
# `#[allow(unsafe_code)]` on the bridge functions instead of a global forbid.
[lints.rust]
unsafe_code = "deny"
