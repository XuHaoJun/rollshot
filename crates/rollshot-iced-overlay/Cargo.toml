[package]
name = "rollshot-iced-overlay"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
publish = false

[dependencies]
image = { version = "0.25", features = ["png"] }
rollshot-capture = { path = "../rollshot-capture" }
rollshot-core = { path = "../rollshot-core" }
rollshot-overlay-core = { path = "../rollshot-overlay-core" }
rollshot-action = { path = "../rollshot-action", optional = true }
rollshot-linux-desktop = { path = "../rollshot-linux-desktop", optional = true }
tracing = { workspace = true }

[features]
action-guide = ["dep:rollshot-action", "dep:ksni", "dep:notify-rust", "dep:rollshot-linux-desktop"]

[target.'cfg(target_os = "linux")'.dependencies]
iced = { version = "0.14", features = ["canvas", "image", "tokio"] }
iced_layershell = "0.18"
ksni = { version = "0.3", optional = true, features = ["blocking"] }
notify-rust = { version = "4", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
iced = { version = "0.14", features = ["canvas", "image", "tokio"] }
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
raw-window-handle = "0.6"

[lints.rust]
unsafe_code = "deny"
