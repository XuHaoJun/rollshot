[package]
name = "rollshot-macos-oneshot"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
thiserror = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-screen-capture-kit = "0.3"
block2 = "0.6"
objc2-core-foundation = "0.3"

[lints.rust]
# This crate intentionally contains unsafe code for Objective-C FFI.
# Unsafe blocks are kept local and documented with ownership invariants.
# The rest of the workspace maintains unsafe_code = "forbid".
unsafe_code = "deny"
