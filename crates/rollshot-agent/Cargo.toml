[package]
name = "rollshot-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
rollshot-automation = { path = "../rollshot-automation" }
rollshot-edit-proposal = { path = "../rollshot-edit-proposal" }
rollshot-image-document = { path = "../rollshot-image-document", features = ["serde"] }
rig-core = { version = "=0.40.0", features = ["test-utils"] }
async-stream = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros"] }
tokio-util = { workspace = true }
futures-util = { workspace = true }
schemars = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
rollshot-automation-rquickjs = { path = "../rollshot-automation-rquickjs" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tracing-subscriber = { workspace = true }
wiremock = { workspace = true }

[lints]
workspace = true
