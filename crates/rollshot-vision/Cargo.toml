[package]
name = "rollshot-vision"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
ocr = ["dep:rollshot-ocr"]

[dependencies]
image = { workspace = true }
imageproc = { workspace = true, features = ["text"] }
rollshot-automation = { path = "../rollshot-automation" }
rollshot-image-document = { path = "../rollshot-image-document", features = ["serde"] }
rollshot-ocr = { path = "../rollshot-ocr", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
ab_glyph = "0.2"
rollshot-automation-rquickjs = { path = "../rollshot-automation-rquickjs" }
rollshot-edit-proposal = { path = "../rollshot-edit-proposal" }
static_assertions = "1.1"
